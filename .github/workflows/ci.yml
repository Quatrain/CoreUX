name: CI & Quality Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'bin/**'
      - 'package.json'
      - 'yarn.lock'
      - 'sonar-project.properties'
      - 'turbo.json'
      - '.github/workflows/ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/**'
      - 'bin/**'
      - 'package.json'
      - 'yarn.lock'
      - 'sonar-project.properties'
      - 'turbo.json'
      - '.github/workflows/ci.yml'

jobs:
  sonarcloud:
    name: SonarCloud Scan & Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CoreUX
    steps:
      - name: Checkout CoreUX
        uses: actions/checkout@v4
        with:
          path: CoreUX
          fetch-depth: 0 # Disable shallow clone for accurate SonarQube blame/authorship

      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          repository: Quatrain/Core
          path: Core
          fetch-depth: 1

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: CoreUX/yarn.lock

      - name: Install dependencies
        run: YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: |
            CoreUX/.turbo
            CoreUX/node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build monorepo packages
        run: yarn build

      - name: Run unit tests with coverage
        run: yarn test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@master
        with:
          projectBaseDir: CoreUX
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish:
    name: Publish Independent Packages
    needs: sonarcloud
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      packages: write
      id-token: write
    defaults:
      run:
        working-directory: CoreUX
    steps:
      - name: Checkout CoreUX
        uses: actions/checkout@v4
        with:
          path: CoreUX
          fetch-depth: 0

      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          repository: Quatrain/Core
          path: Core
          fetch-depth: 1

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: CoreUX/yarn.lock

      - name: Install dependencies
        run: YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: |
            CoreUX/.turbo
            CoreUX/node_modules/.cache/turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Authenticate with registries
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> ~/.npmrc

      - name: Publish all changed packages
        run: yarn publish:all

      - name: Sync with remote to prevent push rejection
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git pull --rebase origin main --autostash

      - name: Commit version bumps & hashes
        uses: stefanzweifel/git-auto-commit-action@v5 # NOSONAR
        with:
          repository: CoreUX
          commit_message: "chore: release versions & update hashes [skip ci]"
          commit_options: '--no-verify'
